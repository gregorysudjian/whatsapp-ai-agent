<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp Agent - Dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #fbfbfc;
    --border: #e3e6ea;
    --text: #14181d;
    --muted: #6b7480;
    --accent: #1f6feb;
    --in: #eef1f5;
    --out: #d8f2dd;
    --ok: #1a7f37;
    --warn: #9a6700;
    --bad: #cf222e;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #161b22; --panel-2: #12171e; --border: #2a313c;
      --text: #e6edf3; --muted: #8b949e; --accent: #4493f8;
      --in: #21262d; --out: #143224; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
    }
  }
  * { box-sizing: border-box; }
  /* Must outrank the display rules below: a class like `.banner {display:flex}`
     beats the UA's `[hidden] {display:none}` and pins the element open. */
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    /* Nothing may push the page wider than the viewport; the flex and grid
       children below all set min-width:0 so long ids shrink instead. */
    overflow-x: hidden;
  }
  :focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px;
  }

  header {
    display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
    padding: 12px 18px; background: var(--panel);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  /* Which business this view belongs to. Once there are several clients,
     an unlabelled page is an invitation to act on the wrong one. */
  header h1 .biz {
    font-weight: 600; color: var(--accent); margin-left: 6px;
    padding: 1px 8px; border-radius: 10px; font-size: 13px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }
  header h1 .biz:empty { display: none; }
  .spacer { flex: 1 1 auto; }
  .meta {
    color: var(--muted); font-size: 12px; font-family: var(--mono);
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .dot.dead { background: var(--bad); }

  .banner {
    padding: 9px 18px; font-size: 13px; font-weight: 600;
    display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
  }
  .banner.off  { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .banner.err  { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .banner .why { font-weight: 400; font-family: var(--mono); font-size: 12px; }

  .tiles {
    display: grid; gap: 10px; padding: 14px 18px;
    grid-template-columns: repeat(auto-fit, minmax(136px, 1fr));
  }
  .tile {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; min-width: 0;
  }
  .tile .n {
    font-size: 21px; font-weight: 650; font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tile .k {
    color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: .04em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tile.alert { border-color: color-mix(in srgb, var(--bad) 45%, var(--border)); }
  .tile.alert .n { color: var(--bad); }

  main {
    display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
    gap: 14px; padding: 0 18px 18px; align-items: start;
  }
  main > * { min-width: 0; }
  /* Declared here, not inline: an inline style would outrank the media query
     below and the mobile ordering could never take effect. */
  .col-thread { display: grid; gap: 14px; min-width: 0; }
  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr); }
    /* Flatten the right-hand column so its two panels can be ordered
       independently; otherwise the whole column moves as one block and the
       conversation list ends up stranded below the event log. */
    .col-thread { display: contents; }
    #threadPanel { order: 1; }   /* the work */
    #convosPanel { order: 2; }   /* navigation */
    #eventsPanel { order: 3; }   /* diagnostics, last */
    .scroll { max-height: 46vh; }
  }

  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; min-width: 0;
  }
  .panel > h2 {
    margin: 0; padding: 9px 12px; font-size: 11px; font-weight: 650;
    text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    background: var(--panel-2); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0;
  }
  .scroll { max-height: 62vh; overflow-y: auto; overscroll-behavior: contain; }

  .convo {
    display: block; width: 100%; text-align: left; background: none;
    border: 0; border-bottom: 1px solid var(--border); padding: 9px 12px;
    cursor: pointer; color: inherit; font: inherit; min-width: 0;
  }
  .convo:hover { background: var(--panel-2); }
  .convo[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .convo .row1 {
    display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; min-width: 0;
  }
  .convo .who { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .convo .num {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    min-width: 0; overflow: hidden; text-overflow: ellipsis;
  }
  .convo .prev {
    color: var(--muted); font-size: 12px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
  }
  .win {
    font-size: 10px; font-family: var(--mono); padding: 1px 5px;
    border-radius: 4px; margin-left: auto; white-space: nowrap; flex: none;
  }
  .win.open   { color: var(--ok);   background: color-mix(in srgb, var(--ok) 15%, transparent); }
  .win.soon   { color: var(--warn); background: color-mix(in srgb, var(--warn) 18%, transparent); }
  .win.closed { color: var(--bad);  background: color-mix(in srgb, var(--bad) 15%, transparent); }

  .thread { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: min(78%, 560px); padding: 7px 10px; border-radius: 10px; min-width: 0; }
  .msg.in  { background: var(--in);  align-self: flex-start; border-bottom-left-radius: 3px; }
  .msg.out { background: var(--out); align-self: flex-end;  border-bottom-right-radius: 3px; }
  .msg .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg .foot {
    font-size: 10px; color: var(--muted); font-family: var(--mono);
    margin-top: 3px; overflow-wrap: anywhere;
  }
  .msg.failed { outline: 1px solid var(--bad); }
  .daymark {
    align-self: center; font-size: 10px; font-family: var(--mono);
    color: var(--muted); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 10px; padding: 1px 8px;
  }

  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 5px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  td.t { font-family: var(--mono); color: var(--muted); white-space: nowrap; width: 1px; }
  td.n { font-weight: 600; white-space: nowrap; width: 1px; }
  td.d { font-family: var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  tr.warn td.n { color: var(--warn); }
  tr.error td.n { color: var(--bad); }

  .empty { padding: 26px 14px; text-align: center; color: var(--muted); font-size: 13px; }

  .toggle, .clearBtn {
    font: inherit; cursor: pointer; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); border-radius: 6px;
  }
  .toggle { font-size: 12px; font-weight: 600; padding: 4px 10px; flex: none; }
  .toggle.on  { border-color: var(--ok);  color: var(--ok); }
  .toggle.off { border-color: var(--bad); color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
  .toggle:hover:not(:disabled), .clearBtn:hover:not(:disabled) { filter: brightness(1.15); }
  .toggle:disabled, .clearBtn:disabled { opacity: .5; cursor: progress; }
  .clearBtn { font-size: 11px; padding: 2px 8px; margin-left: auto; flex: none; }

  .tname { min-width: 0; overflow-wrap: anywhere; }
  .badge {
    font-size: 10px; font-weight: 600; font-family: var(--mono);
    padding: 1px 5px; border-radius: 4px;
    color: var(--warn); background: color-mix(in srgb, var(--warn) 20%, transparent);
    overflow-wrap: anywhere;
  }
  .convo.needs-human { border-left: 3px solid var(--warn); padding-left: 9px; }
</style>
</head>
<body>
<header>
  <h1>WhatsApp Agent <span id="bizName" class="biz"></span></h1>
  <span>
    <span class="dot" id="dot"></span>
    <span class="meta" id="conn" role="status" aria-live="polite">connecting...</span>
  </span>
  <span class="spacer"></span>
  <span class="meta" id="ident"></span>
  <span class="meta" id="uptime"></span>
  <button class="toggle" id="agentToggle" type="button">agent: ...</button>
</header>

<div class="banner off" id="disabledBanner" hidden>
  Agent is OFF
  <span class="why">messages are still received and stored, but nothing is being answered.</span>
</div>

<div class="banner err" id="errorBanner" hidden role="alert">
  <span id="errorText">Lost contact with the server.</span>
  <span class="why" id="errorHint"></span>
</div>

<section class="tiles" id="tiles"></section>

<main>
  <div class="panel" id="convosPanel">
    <h2 id="convosLabel">Conversations <span id="convoCount" class="meta"></span></h2>
    <div class="scroll" id="convos" role="listbox" aria-labelledby="convosLabel" tabindex="0">
      <div class="empty">No conversations yet.</div>
    </div>
  </div>

  <div class="col-thread">
    <div class="panel" id="threadPanel">
      <h2 id="threadTitle">Thread</h2>
      <div class="scroll thread" id="thread">
        <div class="empty">Pick a conversation, or wait for a message to arrive.</div>
      </div>
    </div>
    <div class="panel" id="eventsPanel">
      <h2>Event log</h2>
      <div class="scroll tablewrap"><table id="events"></table></div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let selected = null;
let convoCache = [];
let statsCache = null;

// --- formatting -----------------------------------------------------------

const timeOf = (ms) =>
  new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

const sameDay = (a, b) =>
  a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

/** Time alone is ambiguous once a row is more than a day old. */
function fmtWhen(ms) {
  const d = new Date(ms);
  if (sameDay(d, new Date())) return timeOf(ms);
  return d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + timeOf(ms);
}

function dayLabel(ms) {
  const d = new Date(ms), now = new Date();
  if (sameDay(d, now)) return "Today";
  if (sameDay(d, new Date(now.getTime() - 86400000))) return "Yesterday";
  return d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
}

function ago(ms) {
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 5) return "just now";
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}

function dur(ms) {
  if (ms <= 0) return "closed";
  const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
  return h > 0 ? h + "h " + m + "m" : m + "m";
}

function fmtUptime(seconds) {
  if (seconds < 60) return seconds + "s";
  const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60);
  return h > 0 ? h + "h " + m + "m" : m + "m";
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

/** Raw JSON is hard to scan in a log; key=value reads faster. */
function fmtDetail(detail) {
  if (!detail) return "";
  try {
    const obj = JSON.parse(detail);
    if (obj && typeof obj === "object" && !Array.isArray(obj)) {
      return Object.entries(obj)
        .map(([k, v]) => k + "=" + (typeof v === "object" ? JSON.stringify(v) : String(v)))
        .join("  ");
    }
  } catch { /* not JSON - show it as-is */ }
  return detail;
}

// --- transport ------------------------------------------------------------

/**
 * A failed fetch used to leave the page frozen on stale data with no clue.
 * The likeliest cause is a rotated token: without DASHBOARD_TOKEN pinned in
 * .env a new one is minted on every restart, so a bookmarked URL 401s.
 */
function showError(err) {
  const status = err && err.status;
  $("errorText").textContent =
    status === 401
      ? "Not authorised - the dashboard token has changed."
      : "Lost contact with the server.";
  $("errorHint").textContent =
    status === 401
      ? "A restart mints a new token unless DASHBOARD_TOKEN is set in .env. The current URL is in the server log, on the dashboard_ready line."
      : (err && err.message) || "Retrying automatically.";
  $("errorBanner").hidden = false;
}

async function get(path) {
  const r = await fetch(path, { headers: { accept: "application/json" } });
  if (!r.ok) {
    const e = new Error(path + " -> " + r.status);
    e.status = r.status;
    throw e;
  }
  $("errorBanner").hidden = true;
  return r.json();
}

// --- tiles ----------------------------------------------------------------

const TILES = [
  ["messages", "Messages in/out"], ["contacts", "Contacts"],
  ["openWindows", "Open 24h windows"], ["last24h", "Msgs / 24h"],
  ["cost", "Model spend"], ["latency", "Avg reply"],
  ["failed", "Failed sends", true], ["rejectedSignatures", "Rejected sigs", true],
  ["graphErrors", "Graph errors", true],
];

function tileValue(key, s) {
  if (key === "messages") return s.inbound + " / " + s.outbound;
  if (key === "cost") return "$" + (s.estimatedCostUsd ?? 0).toFixed(2);
  if (key === "latency") return s.avgLatencyMs ? (s.avgLatencyMs / 1000).toFixed(1) + "s" : "-";
  return s[key];
}

async function loadStats() {
  const s = await get("api/stats");
  statsCache = s;

  $("tiles").innerHTML = TILES.map(([k, label, alert]) =>
    '<div class="tile ' + (alert && s[k] > 0 ? "alert" : "") + '">' +
    '<div class="n">' + esc(tileValue(k, s)) + '</div>' +
    '<div class="k">' + label + '</div></div>').join("");

  const toggle = $("agentToggle");
  toggle.textContent = "agent: " + (s.agentEnabled ? "on" : "OFF");
  toggle.className = "toggle " + (s.agentEnabled ? "on" : "off");
  toggle.setAttribute("aria-pressed", String(!s.agentEnabled));
  toggle.title = s.agentEnabled
    ? "Stop the agent replying, in every conversation"
    : "Resume automatic replies";
  $("disabledBanner").hidden = s.agentEnabled;

  $("bizName").textContent = s.businessName || "";
  $("ident").textContent = "phone_id " + s.phoneNumberId + " . " + s.graphVersion;
  $("uptime").textContent = "up " + fmtUptime(s.uptimeSec);

  // Readable from a background tab: this is the queue someone must work.
  document.title = (s.needsHuman ? "(" + s.needsHuman + ") " : "") +
    (s.businessName ? s.businessName + " - " : "") + "WhatsApp Agent";
}

// --- conversations --------------------------------------------------------

function convoMarkup(c) {
  const handoff = c.needsHuman ? ' <span class="badge">needs human</span>' : "";
  const cls = c.windowRemainingMs <= 0 ? "closed"
    : c.windowRemainingMs < 6 * 3600000 ? "soon" : "open";
  const winTitle = c.windowRemainingMs <= 0
    ? "Outside Meta&#39;s 24h window - only template messages can be delivered"
    : "Time left to send a free-form reply";

  return '<button class="convo' + (c.needsHuman ? " needs-human" : "") +
    '" role="option" type="button" data-wa="' + esc(c.waId) +
    '" aria-selected="' + (c.waId === selected) + '" tabindex="-1">' +
    '<div class="row1">' +
      '<span class="who">' + esc(c.name || "Unknown") + handoff + '</span>' +
      '<span class="num">' + esc(c.waId) + '</span>' +
      '<span class="win ' + cls + '" title="' + winTitle +
        '" data-until="' + (Date.now() + c.windowRemainingMs) + '">' +
        dur(c.windowRemainingMs) + '</span>' +
    '</div>' +
    '<div class="prev">' + (c.lastDirection === "out" ? "&#8617; " : "") +
      esc(c.lastText || "-") + '</div>' +
    '<div class="prev">' + c.inboundCount + " in . " + c.outboundCount + " out" +
      (c.lastMessageTs
        ? ' . <span class="rel" data-ts="' + c.lastMessageTs + '">' + ago(c.lastMessageTs) + '</span>'
        : "") +
    '</div>' +
  '</button>';
}

async function loadConvos() {
  convoCache = await get("api/conversations");
  $("convoCount").textContent = convoCache.length ? "(" + convoCache.length + ")" : "";

  if (!convoCache.length) {
    $("convos").innerHTML =
      '<div class="empty">No conversations yet.<br>Message the test number to populate this.</div>';
    $("thread").innerHTML = '<div class="empty">Nothing to show yet.</div>';
    $("threadTitle").textContent = "Thread";
    return;
  }

  $("convos").innerHTML = convoCache.map(convoMarkup).join("");
  for (const el of document.querySelectorAll(".convo")) {
    el.onclick = () => selectConvo(el.dataset.wa);
  }
  if (!selected && convoCache[0]) await selectConvo(convoCache[0].waId);
}

/** A list you can only reach with a mouse is not a list. */
$("convos").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  e.preventDefault();
  const index = convoCache.findIndex((c) => c.waId === selected);
  const next = index + (e.key === "ArrowDown" ? 1 : -1);
  if (next >= 0 && next < convoCache.length) selectConvo(convoCache[next].waId);
});

// --- thread ---------------------------------------------------------------

async function selectConvo(waId) {
  selected = waId;
  for (const el of document.querySelectorAll(".convo")) {
    el.setAttribute("aria-selected", String(el.dataset.wa === waId));
  }

  const c = convoCache.find((x) => x.waId === waId);
  $("threadTitle").innerHTML =
    '<span class="tname">' +
      esc(((c && c.name) || "Unknown") + " . " + waId) + '</span>' +
    (c && c.needsHuman
      ? '<span class="badge">needs human' +
        (c.handoffReason ? ": " + esc(c.handoffReason) : "") + '</span>' +
        '<button class="clearBtn" id="clearHandoff" type="button">resume agent</button>'
      : "");

  const clearBtn = $("clearHandoff");
  if (clearBtn) {
    clearBtn.onclick = async (e) => {
      e.stopPropagation();
      clearBtn.disabled = true;
      try {
        await fetch("api/conversations/" + encodeURIComponent(waId) + "/clear-handoff",
          { method: "POST" });
        refresh(true);
      } catch (err) {
        showError(err);
        clearBtn.disabled = false;
      }
    };
  }

  const thread = $("thread");
  // Preserve reading position. Re-rendering on every incoming event used to
  // yank an operator who had scrolled up through history back to the bottom.
  const wasAtBottom = thread.scrollHeight - thread.scrollTop - thread.clientHeight < 40;
  const previousTop = thread.scrollTop;

  let msgs;
  try {
    msgs = await get("api/conversations/" + encodeURIComponent(waId) + "/messages");
  } catch (err) {
    showError(err);
    return;
  }

  if (!msgs.length) {
    thread.innerHTML = '<div class="empty">No messages stored.</div>';
    return;
  }

  let lastDay = "";
  thread.innerHTML = msgs.map((m) => {
    const day = dayLabel(m.ts);
    const marker = day === lastDay ? "" : '<div class="daymark">' + esc(day) + '</div>';
    lastDay = day;

    const usage = m.inputTokens != null
      ? " . " + m.inputTokens + "in/" + m.outputTokens + "out" +
        (m.cacheReadTokens ? " (" + m.cacheReadTokens + " cached)" : "") +
        (m.latencyMs ? " . " + (m.latencyMs / 1000).toFixed(1) + "s" : "")
      : "";

    return marker +
      '<div class="msg ' + m.direction + (m.status === "failed" ? " failed" : "") + '">' +
        '<div class="body">' + esc(m.text || "(" + m.type + ")") + '</div>' +
        '<div class="foot">' + timeOf(m.ts) + (m.status ? " . " + m.status : "") +
          usage + (m.error ? " . " + esc(m.error) : "") + '</div>' +
      '</div>';
  }).join("");

  thread.scrollTop = wasAtBottom ? thread.scrollHeight : previousTop;
}

// --- events ---------------------------------------------------------------

async function loadEvents() {
  const rows = await get("api/events");
  $("events").innerHTML = rows.length
    ? rows.map((e) =>
        '<tr class="' + esc(e.level) + '">' +
        '<td class="t">' + fmtWhen(e.ts) + '</td>' +
        '<td class="n">' + esc(e.name) + '</td>' +
        '<td class="d">' + esc(fmtDetail(e.detail)) + '</td></tr>').join("")
    : '<tr><td class="empty" colspan="3">No events yet.</td></tr>';
}

// --- agent toggle ---------------------------------------------------------

$("agentToggle").onclick = async () => {
  const button = $("agentToggle");
  const enabled = statsCache ? statsCache.agentEnabled : true;

  // Turning it off silences every conversation at once - worth a beat.
  if (enabled && !confirm(
    "Stop the agent replying?\n\nMessages will still arrive and be stored, but nobody gets an answer until you turn it back on."
  )) return;

  button.disabled = true;
  try {
    // Sent explicitly rather than read-then-negate, so a double click cannot
    // race itself into the wrong state.
    await fetch("api/agent/toggle", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ enabled: !enabled }),
    });
    await loadStats();
  } catch (err) {
    showError(err);
  } finally {
    button.disabled = false;
  }
};

// --- live updates ---------------------------------------------------------

let pending = null;
function refresh(alsoThread) {
  clearTimeout(pending);            // coalesce bursts into one round of fetches
  pending = setTimeout(async () => {
    try {
      await Promise.all([loadStats(), loadConvos(), loadEvents()]);
      if (alsoThread && selected) await selectConvo(selected);
    } catch (err) {
      showError(err);
    }
  }, 120);
}

function connect() {
  const es = new EventSource("api/stream");
  es.onopen = () => {
    $("dot").className = "dot live";
    $("conn").textContent = "live";
    $("errorBanner").hidden = true;
  };
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    refresh(ev.kind !== "event" && (!selected || ev.waId === selected));
  };
  es.onerror = () => {
    $("dot").className = "dot dead";
    $("conn").textContent = "disconnected - retrying";
    // EventSource reconnects on its own; don't stack a second stream on top.
  };
}

/**
 * Relative times go stale between polls. Updated in place rather than by
 * re-rendering, which would drop focus and any text the operator selected.
 */
setInterval(() => {
  const now = Date.now();
  for (const el of document.querySelectorAll(".rel")) {
    el.textContent = ago(Number(el.dataset.ts));
  }
  for (const el of document.querySelectorAll(".win")) {
    const remaining = Number(el.dataset.until) - now;
    el.textContent = dur(remaining);
    el.className = "win " + (remaining <= 0 ? "closed" : remaining < 6 * 3600000 ? "soon" : "open");
  }
}, 10000);

refresh(false);
// ?nostream=1 skips the live stream - an open EventSource keeps a headless
// browser's page-load pending forever, which blocks screenshot tooling.
if (!location.search.includes("nostream")) connect();
setInterval(() => { refresh(false); }, 30000);
</script>
</body>
</html>
